name: Social PRO protected access checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Auth token tests
        run: node --experimental-strip-types --test tests/protected-access.test.mjs
      - name: Build
        run: npm run build
      - name: HTTP access smoke test
        run: node scripts/smoke-access.mjs
